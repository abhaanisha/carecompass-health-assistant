# Hand-labelled evaluation set.
#
# Labels were written from the clinical content first and the system was then
# measured against them. Where the system and the label disagree the case is
# reported as a failure rather than quietly relabelled, because a gold set
# tuned to match the implementation measures nothing.
#
# Fields
#   expected_urgency : the level a careful triage nurse would assign
#   expect_red_flag  : rule id that must fire (safety recall)
#   expect_docs      : at least one of these must appear in the top-k passages
#   expect_restricted: restricted-intent id that must be detected
#   expect_grounded  : false for questions the corpus deliberately does not cover

version: 1
updated: "2026-09-01"

