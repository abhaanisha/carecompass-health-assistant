# The CSS in streamlit_app.py does the detailed work; these are the values
# Streamlit bakes into widget internals that CSS cannot reliably reach.
[theme]
base = "light"
primaryColor = "#0b7a6b"
backgroundColor = "#f7fafb"
secondaryBackgroundColor = "#ffffff"
textColor = "#101a24"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
