# Localised red-flag text.
#
# The emergency card is fixed text, so its Hindi and Bengali versions have to be
# fixed text too. A card that switches to English for the one line explaining
# WHY it is an emergency is worse than no translation at all.
#
# Kept in its own file rather than inline in red_flags.yaml so that the matching
# logic there stays readable during clinical review, and so a translator can be
# handed this file alone. English is the fallback for any id or language missing
# here.

version: 1
updated: "2026-09-01"

rules:
  cardiac_acs:
    hi:
      label: "दिल का दौरा हो सकता है"
      guidance: "सीने में दर्द के साथ पसीना, जी मिचलाना, साँस फूलना, या बाँह या जबड़े तक फैलता दर्द दिल का दौरा हो सकता है। अभी 112 या 108 पर कॉल करें। खुद गाड़ी चलाकर अस्पताल न जाएँ।"
    bn:
      label: "হার্ট অ্যাটাক হতে পারে"
      guidance: "বুকে ব্যথার সঙ্গে ঘাম, বমিভাব, শ্বাসকষ্ট, বা হাত বা চোয়াল পর্যন্ত ছড়িয়ে পড়া ব্যথা হার্ট অ্যাটাক হতে পারে। এখনই 112 বা 108 নম্বরে ফোন করুন। নিজে গাড়ি চালিয়ে হাসপাতালে যাবেন না।"

  stroke:
    hi:
      label: "स्ट्रोक या लकवा हो सकता है"
      guidance: "अचानक चेहरा टेढ़ा होना, एक बाँह में कमज़ोरी, या बोलने में दिक्कत स्ट्रोक का संकेत है। तुरंत 112 पर कॉल करें और याद रखें कि लक्षण किस समय शुरू हुए। इलाज सीमित समय में ही असर करता है। कुछ भी खाने या पीने को न दें।"
    bn:
      label: "স্ট্রোক হতে পারে"
      guidance: "হঠাৎ মুখ বেঁকে যাওয়া, এক হাতে দুর্বলতা, বা কথা জড়িয়ে যাওয়া স্ট্রোকের লক্ষণ। এখনই 112 নম্বরে ফোন করুন এবং লক্ষণ কখন শুরু হয়েছিল তা মনে রাখুন। চিকিৎসা নির্দিষ্ট সময়ের মধ্যেই কাজ করে। মুখে কিছু খেতে দেবেন না।"

  airway_breathing:
    hi:
      label: "साँस लेने में गंभीर तकलीफ"
      guidance: "साँस की गंभीर तकलीफ, या होंठ और उँगलियों का नीला पड़ना आपात स्थिति है। अभी 112 पर कॉल करें, मरीज़ को सीधा बैठाएँ, और यदि उनका इनहेलर है तो उसे लेने में मदद करें।"
    bn:
      label: "তীব্র শ্বাসকষ্ট"
      guidance: "তীব্র শ্বাসকষ্ট, বা ঠোঁট ও আঙুল নীল হয়ে যাওয়া জরুরি অবস্থা। এখনই 112 নম্বরে ফোন করুন, রোগীকে সোজা করে বসান, এবং তাঁর ইনহেলার থাকলে তা নিতে সাহায্য করুন।"

  unconscious_seizure:
    hi:
      label: "बेहोशी, दौरा या अचानक गिर पड़ना"
      guidance: "अभी 112 पर कॉल करें। यदि साँस चल रही है तो मरीज़ को करवट पर लिटाएँ। दौरे के दौरान मुँह में कुछ भी न डालें।"
    bn:
      label: "অজ্ঞান হওয়া, খিঁচুনি বা হঠাৎ পড়ে যাওয়া"
      guidance: "এখনই 112 নম্বরে ফোন করুন। শ্বাস চললে রোগীকে একপাশে কাত করে শোয়ান। খিঁচুনির সময় মুখে কিছু ঢোকাবেন না।"

  severe_bleeding_trauma:
    hi:
      label: "तेज़ रक्तस्राव या गंभीर चोट"
      guidance: "साफ़ कपड़े से घाव पर लगातार मज़बूत दबाव बनाए रखें और 112 पर कॉल करें। घाव में धँसी वस्तु को न निकालें और दबाव हटाकर बार-बार जाँचें नहीं।"
    bn:
      label: "প্রচণ্ড রক্তপাত বা গুরুতর আঘাত"
      guidance: "পরিষ্কার কাপড় দিয়ে ক্ষতের উপর একটানা জোরে চাপ দিন এবং 112 নম্বরে ফোন করুন। ক্ষতে গেঁথে থাকা জিনিস টেনে বার করবেন না, বারবার চাপ সরিয়ে দেখবেন না।"

  self_harm:
    hi:
      label: "स्वयं को नुकसान पहुँचाने का जोखिम"
      guidance: "आपको अभी सहारे की ज़रूरत है। टेली-मानस 14416 और किरण 1800-599-0019 निःशुल्क, गोपनीय और 24x7 उपलब्ध हैं। तत्काल खतरा हो तो 112 पर कॉल करें।"
    bn:
      label: "নিজের ক্ষতি করার ঝুঁকি"
      guidance: "আপনার এখন সহায়তা প্রয়োজন। টেলি-মানস 14416 এবং কিরণ 1800-599-0019 বিনামূল্যে, গোপনীয় ও 24x7 খোলা। তাৎক্ষণিক বিপদ হলে 112 নম্বরে ফোন করুন।"

  poisoning_snakebite:
    hi:
      label: "ज़हर, दवा की अधिक मात्रा या साँप का काटना"
      guidance: "तुरंत अस्पताल पहुँचें। ज़हर हेल्पलाइन 1800-116-117। साँप के काटने पर अंग को स्थिर और हृदय से नीचे रखें। घाव को काटें नहीं, चूसें नहीं, और कसकर पट्टी न बाँधें।"
    bn:
      label: "বিষক্রিয়া, ওষুধের অতিরিক্ত মাত্রা বা সাপের কামড়"
      guidance: "এখনই হাসপাতালে যান। বিষ হেল্পলাইন 1800-116-117। সাপে কামড়ালে আক্রান্ত অঙ্গ স্থির রাখুন ও হৃৎপিণ্ডের নীচে রাখুন। ক্ষত কাটবেন না, চুষবেন না, শক্ত বাঁধন দেবেন না।"

  meningitis:
    hi:
      label: "मेनिनजाइटिस या गंभीर संक्रमण हो सकता है"
      guidance: "बुखार के साथ गर्दन अकड़ना, तेज़ सिरदर्द, रोशनी से तकलीफ़, या ऐसे दाने जो काँच से दबाने पर फीके न पड़ें, मेनिनजाइटिस हो सकता है। अभी आपातकालीन विभाग जाएँ।"
    bn:
      label: "মেনিনজাইটিস বা গুরুতর সংক্রমণ হতে পারে"
      guidance: "জ্বরের সঙ্গে ঘাড় শক্ত হওয়া, তীব্র মাথাব্যথা, আলোয় অস্বস্তি, বা কাচ দিয়ে চাপলেও মিলিয়ে না যাওয়া র্যাশ মেনিনজাইটিস হতে পারে। এখনই জরুরি বিভাগে যান।"

  obstetric_emergency:
    hi:
      label: "गर्भावस्था का खतरे का संकेत"
      guidance: "गर्भावस्था में रक्तस्राव, धुंधली दृष्टि के साथ तेज़ सिरदर्द, दौरा, तेज़ पेट दर्द, या बच्चे का हिलना कम हो जाना आपात स्थिति है। अभी 102, 108 या 112 पर कॉल करें।"
    bn:
      label: "গর্ভাবস্থার বিপদচিহ্ন"
      guidance: "গর্ভাবস্থায় রক্তপাত, ঝাপসা দৃষ্টিসহ তীব্র মাথাব্যথা, খিঁচুনি, তীব্র পেটে ব্যথা, বা শিশুর নড়াচড়া কমে যাওয়া জরুরি অবস্থা। এখনই 102, 108 বা 112 নম্বরে ফোন করুন।"

  infant_fever:
    hi:
      label: "छोटे शिशु में बुखार या खतरे का संकेत"
      guidance: "तीन महीने से छोटे शिशु में कोई भी बुखार या दूध न पीना आपात स्थिति है। इंतज़ार न करें, अभी अस्पताल जाएँ।"
    bn:
      label: "ছোট শিশুর জ্বর বা বিপদচিহ্ন"
      guidance: "তিন মাসের কম বয়সী শিশুর যেকোনও জ্বর বা দুধ না খাওয়া জরুরি অবস্থা। অপেক্ষা করবেন না, এখনই হাসপাতালে যান।"

  dka_hypoglycaemia:
    hi:
      label: "ब्लड शुगर की आपात स्थिति"
      guidance: "यदि व्यक्ति होश में है तो 15 ग्राम तेज़ शर्करा दें और 15 मिनट बाद दोबारा जाँचें। यदि वे सुस्त, बेहोश या दौरे में हैं तो मुँह में कुछ न डालें और 112 पर कॉल करें।"
    bn:
      label: "রক্তে শর্করার জরুরি অবস্থা"
      guidance: "ব্যক্তি সজ্ঞান থাকলে 15 গ্রাম দ্রুত শর্করা দিন এবং 15 মিনিট পরে আবার মাপুন। ঝিমিয়ে পড়লে, অজ্ঞান হলে বা খিঁচুনি হলে মুখে কিছু দেবেন না, 112 নম্বরে ফোন করুন।"

  severe_dehydration:
    hi:
      label: "गंभीर निर्जलीकरण"
      guidance: "ये गंभीर निर्जलीकरण के संकेत हैं। सिर्फ़ मुँह से पानी देना काफ़ी नहीं है। नस के ज़रिए तरल चढ़ाने के लिए अभी अस्पताल जाएँ।"
    bn:
      label: "তীব্র জলশূন্যতা"
      guidance: "এগুলি তীব্র জলশূন্যতার লক্ষণ। শুধু মুখে জল খাওয়ানো যথেষ্ট নয়। শিরায় স্যালাইনের জন্য এখনই হাসপাতালে যান।"

  hypertensive_crisis:
    hi:
      label: "रक्तचाप की आपात स्थिति"
      guidance: "180/120 से ऊपर की रीडिंग के साथ सीने में दर्द, साँस फूलना, तेज़ सिरदर्द, भ्रम या कमज़ोरी हो तो यह आपात स्थिति है। 112 पर कॉल करें। खुद से दवा की मात्रा न बदलें।"
    bn:
      label: "রক্তচাপের জরুরি অবস্থা"
      guidance: "180/120-এর বেশি রিডিংয়ের সঙ্গে বুকে ব্যথা, শ্বাসকষ্ট, তীব্র মাথাব্যথা, বিভ্রান্তি বা দুর্বলতা থাকলে তা জরুরি অবস্থা। 112 নম্বরে ফোন করুন। নিজে থেকে ওষুধের মাত্রা বদলাবেন না।"

  dengue_warning:
    hi:
      label: "डेंगू के खतरे के संकेत"
      guidance: "ये डेंगू के खतरे के संकेत हैं और आमतौर पर बुखार उतरते समय, तीसरे से सातवें दिन दिखते हैं। अभी अस्पताल जाएँ। इबुप्रोफ़ेन और ऐस्पिरिन से बचें।"
    bn:
      label: "ডেঙ্গুর বিপদচিহ্ন"
      guidance: "এগুলি ডেঙ্গুর বিপদচিহ্ন এবং সাধারণত জ্বর কমার সময়, তৃতীয় থেকে সপ্তম দিনে দেখা দেয়। এখনই হাসপাতালে যান। আইবুপ্রোফেন ও অ্যাসপিরিন এড়িয়ে চলুন।"

  heat_stroke:
    hi:
      label: "लू लगना या हीट स्ट्रोक हो सकता है"
      guidance: "भ्रम या बेहोशी के साथ हीट स्ट्रोक आपात स्थिति है। 112 पर कॉल करें, छाया में ले जाएँ, ऊपरी कपड़े हटाएँ, और पानी तथा पंखे से तेज़ी से ठंडा करें।"
    bn:
      label: "হিটস্ট্রোক হতে পারে"
      guidance: "বিভ্রান্তি বা অজ্ঞান হওয়ার সঙ্গে হিটস্ট্রোক জরুরি অবস্থা। 112 নম্বরে ফোন করুন, ছায়ায় নিয়ে যান, বাইরের পোশাক খুলে দিন, এবং জল ও পাখা দিয়ে দ্রুত ঠান্ডা করুন।"

  acute_abdomen:
    hi:
      label: "पेट की गंभीर समस्या हो सकती है"
      guidance: "तेज़ पेट दर्द, ख़ासकर बुखार, उल्टी या पेट के सख़्त होने के साथ, उसी दिन जाँच कराएँ। जाँच से पहले दर्द निवारक दवा न लें।"
    bn:
      label: "পেটের গুরুতর সমস্যা হতে পারে"
      guidance: "তীব্র পেটে ব্যথা, বিশেষত জ্বর, বমি বা পেট শক্ত হয়ে যাওয়ার সঙ্গে, সেদিনই পরীক্ষা করান। পরীক্ষার আগে ব্যথার ওষুধ খাবেন না।"

  severe_burn:
    hi:
      label: "गंभीर जलन"
      guidance: "जले हुए हिस्से को 20 मिनट तक बहते ठंडे पानी के नीचे रखें, साफ़ कपड़े से ढीला ढकें, और डॉक्टर को दिखाएँ। बर्फ़, टूथपेस्ट, मक्खन या घी कभी न लगाएँ।"
    bn:
      label: "গুরুতর পোড়া"
      guidance: "পোড়া জায়গা 20 মিনিট বয়ে যাওয়া ঠান্ডা জলের নীচে রাখুন, পরিষ্কার কাপড়ে আলগা করে ঢাকুন, এবং ডাক্তার দেখান। বরফ, টুথপেস্ট, মাখন বা ঘি কখনও লাগাবেন না।"

  abnormal_reading:
    hi:
      label: "जाँच की रीडिंग सामान्य सीमा से ऊपर"
      guidance: "एक बार की ऊँची रीडिंग अपने आप में निदान नहीं है, लेकिन इसे दोबारा जाँच कर पुष्टि करना ज़रूरी है। इंतज़ार करना ठीक नहीं।"
    bn:
      label: "পরীক্ষার রিডিং স্বাভাবিক সীমার উপরে"
      guidance: "একবারের বেশি রিডিং নিজে থেকে রোগনির্ণয় নয়, তবে পুনরায় পরীক্ষা করে নিশ্চিত হওয়া দরকার। অপেক্ষা করা ঠিক নয়।"

  persistent_cough_tb:
    hi:
      label: "दो हफ़्ते से ज़्यादा पुरानी खाँसी"
      guidance: "दो हफ़्ते से ज़्यादा चलने वाली खाँसी की टीबी के लिए जाँच होनी चाहिए। सरकारी स्वास्थ्य केंद्रों पर बलगम जाँच और इलाज निःशुल्क है।"
    bn:
      label: "দুই সপ্তাহের বেশি স্থায়ী কাশি"
      guidance: "দুই সপ্তাহের বেশি স্থায়ী কাশির জন্য যক্ষ্মা পরীক্ষা করানো উচিত। সরকারি স্বাস্থ্যকেন্দ্রে কফ পরীক্ষা ও চিকিৎসা বিনামূল্যে।"
